<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/ui.css">

</head>
<body>
    <div>

            <section class="flex">
                <a href="#" class="logo">Educa..</a>

                    <div id="btn-sidebar" class="fas fa-bars"></div>

                </div>
                <div class="profile">
                    <img src="https://adminlte.io/themes/v3/dist/img/user4-128x128.jpg" alt="">

                    <span>Student</span>
                    <a href="#" class="btn">View Profile</a>

                        <a href="#" class="btn btn-option">Login</a>

                    </div>
                </div>
            </section>
        </header>
        <div class="sidebar">
            <div class="sidebar-close">
                <i class="fas fa-times"></i>
            </div>

                <span>Student</span>
                <a href="#" class="btn">View Profile</a>
            </div>
            <nav class="navbar">
                <a href="">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Courses</span>
                </a>

</html>
